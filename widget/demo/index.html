<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odda Notebook widget demo</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:24px;max-width:960px;margin-inline:auto;line-height:1.5;background:#fafafa;color:#14141f}
  body.dark{background:#0e0e14;color:#ececf3}
  .panel{display:flex;flex-wrap:wrap;gap:16px;align-items:end;padding:16px;border:1px solid #ccc;border-radius:12px;margin-bottom:24px}
  label{display:flex;flex-direction:column;font-size:13px;gap:4px}
  input,select,button{font:inherit;padding:6px 8px}
  odda-notebook-chat{max-width:480px;--onw-radius:14px}
</style>
</head>
<body>
<h1>Odda Notebook widget</h1>
<p>Run <code>npm run dev</code> and open this page: the mock server answers at the same origin.</p>

<div class="panel">
  <label>Backend
    <select id="mode">
      <option value="mock">Mock server (this origin)</option>
      <option value="custom">Custom API</option>
    </select>
  </label>
  <label>Mock scenario (widget-key)
    <select id="scenario">
      <option value="ok">ok - streams an answer</option>
      <option value="bad">bad - 401</option>
      <option value="slow">slow - 429 Retry-After</option>
      <option value="down">down - 503</option>
      <option value="fail">fail - error event</option>
    </select>
  </label>
  <label>API URL (custom) <input id="url" placeholder="https://notebooks.example.com"></label>
  <label>Widget key (custom) <input id="key" placeholder="onw_..."></label>
  <label>Notebook id (custom) <input id="nb" value="notebook:demo"></label>
  <label>Theme
    <select id="theme"><option>auto</option><option>light</option><option>dark</option></select>
  </label>
  <label>Language
    <select id="lang"><option>en</option><option>it</option></select>
  </label>
  <label>Search mode
    <select id="sm"><option>insights-first</option><option>insights</option><option>full</option></select>
  </label>
  <label>Color <input id="color" type="color" value="#2000ff"></label>
</div>

<h2>Inline: &lt;odda-notebook-chat&gt;</h2>
<odda-notebook-chat id="inline"
  title="Ask the docs"
  welcome-message="Hi! Ask me anything about **this notebook**."
  suggestions='["What is this about?","Summarise the key points"]'
  height="480px"></odda-notebook-chat>

<h2>Floating: &lt;odda-notebook-chatbot&gt;</h2>
<p>See the launcher at the bottom-right corner.</p>
<odda-notebook-chatbot id="bot"
  title="Odda assistant"
  welcome-message="Hello! How can I help?"
  suggestions="What can you do?|Give me an example"
  button-label="Open assistant"></odda-notebook-chatbot>

<script src="/dist/odda-notebook-widget.js"></script>
<script>
  const els = [document.getElementById("inline"), document.getElementById("bot")];
  const $ = (id) => document.getElementById(id);
  function apply() {
    const mock = $("mode").value === "mock";
    const attrs = {
      "api-url": mock ? location.origin : $("url").value,
      "widget-key": mock ? $("scenario").value : $("key").value,
      "notebook-id": mock ? "notebook:demo" : $("nb").value,
      theme: $("theme").value,
      lang: $("lang").value,
      "search-mode": $("sm").value,
      "primary-color": $("color").value,
    };
    for (const el of els) for (const [k, v] of Object.entries(attrs)) v ? el.setAttribute(k, v) : el.removeAttribute(k);
    document.body.classList.toggle("dark", attrs.theme === "dark" || (attrs.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches));
  }
  document.querySelectorAll(".panel select,.panel input").forEach((i) => i.addEventListener("input", apply));
  apply();
  for (const ev of ["onw-message", "onw-answer", "onw-error", "onw-open", "onw-close"])
    document.addEventListener(ev, (e) => console.log(ev, e.detail));
</script>
</body>
</html>
